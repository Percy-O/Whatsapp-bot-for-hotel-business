services:
  - type: web
    name: hotel-whatsapp-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    environmentSlug: python-3
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: HOTEL_NAME
        sync: false
      - key: STAFF_WHATSAPP
        sync: false
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-bot-db
          property: connectionString
  
  - type: postgres
    name: hotel-bot-db
    ipAllowList: []
    plan: free
